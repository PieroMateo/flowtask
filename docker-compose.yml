services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # 4 barras porque es sqlite:// mas la ruta absoluta /app/data/...
      DATABASE_URL: sqlite:////app/data/flowtask.db
      CORS_ORIGINS: '["http://localhost:4200"]'
    volumes:
      # la bd queda en un volumen para no perder las tareas al reiniciar
      - flowtask-data:/app/data
    # revisa cada 5 segundos si el backend ya responde
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    # el frontend espera a que el backend este respondiendo, no solo encendido
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flowtask-data:
