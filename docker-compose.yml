services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Ruta absoluta dentro del contenedor (4 barras = sqlite:// + /app/data/...).
      DATABASE_URL: sqlite:////app/data/flowtask.db
      CORS_ORIGINS: '["http://localhost:4200"]'
    volumes:
      # La base de datos vive en un volumen: sobrevive a reinicios y reconstrucciones.
      - flowtask-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flowtask-data:
