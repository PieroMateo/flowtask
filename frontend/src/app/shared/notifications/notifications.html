<!-- aria-live: los lectores de pantalla anuncian los avisos nuevos. -->
<div class="fixed bottom-4 right-4 z-50 flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-2" aria-live="polite">
  @for (n of notificationService.notifications(); track n.id) {
    <div
      class="flex items-start gap-3 rounded-lg border px-4 py-3 text-sm shadow-md"
      [class]="n.type === 'error'
        ? 'border-red-200 bg-red-50 text-red-800'
        : 'border-emerald-200 bg-emerald-50 text-emerald-800'"
      role="status"
    >
      <p class="flex-1">{{ n.message }}</p>
      <button
        type="button"
        class="text-lg leading-none opacity-60 hover:opacity-100"
        (click)="notificationService.dismiss(n.id)"
        aria-label="Cerrar aviso"
      >
        &times;
      </button>
    </div>
  }
</div>
