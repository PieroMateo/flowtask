<form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
    Título *
    <input class="input" type="text" formControlName="title" placeholder="Ej. Preparar informe mensual" maxlength="150" />
    @if (showError('title')) {
      <span class="text-xs font-normal text-red-600">El título es obligatorio.</span>
    }
  </label>

  <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
    Descripción
    <textarea class="input min-h-20" formControlName="description" placeholder="Opcional"></textarea>
  </label>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Fecha límite *
      <!-- type="date" entrega el valor como "YYYY-MM-DD", justo el formato que espera la API. -->
      <input class="input" type="date" formControlName="due_date" />
      @if (showError('due_date')) {
        <span class="text-xs font-normal text-red-600">Selecciona una fecha.</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Estado
      <select class="input" formControlName="status">
        @for (status of statuses; track status) {
          <option [ngValue]="status">{{ status }}</option>
        }
      </select>
    </label>
  </div>

  <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
    Categoría *
    <select class="input" formControlName="category_id">
      <!-- [ngValue] conserva el tipo: el control recibe el número 1, no el texto "1". -->
      <option [ngValue]="null" disabled>Selecciona una categoría</option>
      @for (category of categories(); track category.id) {
        <option [ngValue]="category.id">{{ category.name }}</option>
      }
    </select>
    @if (showError('category_id')) {
      <span class="text-xs font-normal text-red-600">Selecciona una categoría.</span>
    }
  </label>

  <button type="submit" class="btn-primary" [disabled]="submitting()">
    {{ submitting() ? 'Guardando…' : 'Crear tarea' }}
  </button>
</form>
